<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1210'/%3E%3Cpath d='M16 5l9 8-9 14-9-14z' fill='none' stroke='%2339ff88' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">

</head>
<body>
  <noscript>
    <div class="noscript-fallback">
      This page is an interactive terminal and needs JavaScript to run.
      <a href="../site/index.html">View the standard portfolio instead →</a>
    </div>
  </noscript>

  <div class="crt-overlay" aria-hidden="true"></div>

  <main class="term-app">
    <div class="term-titlebar">
      <span class="term-dots" aria-hidden="true">
        <span class="term-dot term-dot--a"></span>
        <span class="term-dot term-dot--b"></span>
        <span class="term-dot term-dot--c"></span>
      </span>
      <span class="term-titlebar__path code-tag">dheeraj@portfolio:~$</span>
      <a class="term-legacy-link code-tag" href="../site/index.html">prefer a normal page? →</a>
    </div>

    <div class="term-screen" id="term-screen">
      <div class="term-output" id="term-output"></div>
      <div class="term-inputline">
        <span class="term-prompt code-tag" id="term-prompt">guest@portfolio:~$</span>
        <input class="term-input code-tag" id="term-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Terminal command input" disabled>
      </div>
    </div>

    <div class="term-chips code-tag" id="term-chips" aria-label="Quick commands">
      <button type="button" data-cmd="help">help</button>
      <button type="button" data-cmd="about">about</button>
      <button type="button" data-cmd="ls projects">projects</button>
      <button type="button" data-cmd="skills">skills</button>
      <button type="button" data-cmd="contact">contact</button>
      <button type="button" data-cmd="clear">clear</button>
    </div>
  </main>

  <script src="js/commands.js"></script>
  <script src="js/terminal.js"></script>
</body>
</html>
