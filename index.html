<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dheeraj P V</title>
<meta http-equiv="refresh" content="0; url=./site/">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d1210">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1210'/%3E%3Cpath d='M16 5l9 8-9 14-9-14z' fill='none' stroke='%2339ff88' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #0d1210; color: #e8fff2;
    font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    padding: 24px;
  }
  .window {
    width: 100%; max-width: 480px;
    border: 1px solid #24312b; border-radius: 10px;
    background: #0f1512; overflow: hidden;
  }
  .titlebar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; background: #141c18; border-bottom: 1px solid #24312b;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot--a { background: #ff5f56; }
  .dot--b { background: #ffbd2e; }
  .dot--c { background: #27c93f; }
  .titlebar__path { margin-left: 6px; font-size: 12px; color: #7d8f88; }
  .screen { padding: 20px 22px 24px; font-size: 14px; line-height: 1.7; }
  .line { margin: 0 0 4px; white-space: pre-wrap; word-break: break-word; }
  .prompt { color: #39ff88; }
  .muted { color: #7d8f88; }
  a { color: #39ff88; text-decoration: none; }
  a:hover, a:focus-visible { text-decoration: underline; }
  .cursor {
    display: inline-block; width: 0.5em; height: 1em; margin-left: 2px;
    background: #39ff88; vertical-align: -0.15em;
    animation: blink 1s steps(1, end) infinite;
  }
  @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
</style>
</head>
<body>
  <main class="window">
    <div class="titlebar">
      <span class="dot dot--a"></span>
      <span class="dot dot--b"></span>
      <span class="dot dot--c"></span>
      <span class="titlebar__path">~/dheeraj-pv — zsh</span>
    </div>
    <div class="screen">
      <p class="line prompt">$ cd ./site<span class="cursor" aria-hidden="true"></span></p>
      <p class="line muted">redirecting&hellip;</p>
      <p class="line muted">&nbsp;</p>
      <p class="line">not redirected? <a href="./site/">open ./site/</a></p>
    </div>
  </main>
</body>
</html>
