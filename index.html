<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dheeraj P V</title>
<meta http-equiv="refresh" content="0; url=./site/">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#182110">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23DDA15E'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='system-ui,sans-serif' font-size='19' font-weight='700' fill='%23283618'%3ED%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="site/css/tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: var(--color-bg); color: var(--color-text);
    font-family: var(--font-mono);
    padding: 24px;
  }
  .window {
    width: 100%; max-width: 480px;
    border: 1px solid var(--color-line); border-radius: 10px;
    background: var(--color-surface); overflow: hidden;
  }
  .titlebar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; background: var(--color-surface); border-bottom: 1px solid var(--color-line);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot--a { background: #ff5f56; }
  .dot--b { background: #ffbd2e; }
  .dot--c { background: #27c93f; }
  .titlebar__path { margin-left: 6px; font-size: 12px; color: var(--color-text-muted); }
  .screen { padding: 20px 22px 24px; font-size: 14px; line-height: 1.7; }
  .line { margin: 0 0 4px; white-space: pre-wrap; word-break: break-word; }
  .prompt { color: var(--color-accent); }
  .muted { color: var(--color-text-muted); }
  a { color: var(--color-accent); text-decoration: none; }
  a:hover, a:focus-visible { text-decoration: underline; }
  .cursor {
    display: inline-block; width: 0.5em; height: 1em; margin-left: 2px;
    background: var(--color-accent); vertical-align: -0.15em;
    animation: blink 1s steps(1, end) infinite;
  }
  @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
</style>
</head>
<body>
  <main class="window">
    <div class="titlebar">
      <span class="dot dot--a"></span>
      <span class="dot dot--b"></span>
      <span class="dot dot--c"></span>
      <span class="titlebar__path">~/dheeraj-pv — zsh</span>
    </div>
    <div class="screen">
      <p class="line prompt">$ cd ./site<span class="cursor" aria-hidden="true"></span></p>
      <p class="line muted">redirecting&hellip;</p>
      <p class="line muted">&nbsp;</p>
      <p class="line">not redirected? <a href="./site/">open ./site/</a></p>
    </div>
  </main>
</body>
</html>
